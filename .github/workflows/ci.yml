name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只读权限：不发布、不写任何仓库内容
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  # 与本地开发一致（unit-data 等有日期/日期键断言；避免 runner 默认 UTC 造成时区相关红点）
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # 1) 类型检查（与 build 里的 tsc 分离，失败时一眼定位）
  # ---------------------------------------------------------------------------
  static:
    name: static (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 2) 单测分片（并行；单 fork 防内存峰值）
  # ---------------------------------------------------------------------------
  unit-core:
    name: unit-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests (core + scheduling)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx vitest run tests/core tests/scheduling.test.ts \
            --pool=forks --poolOptions.forks.maxForks=1 2>&1 | tee ci-logs/unit-core.log
      - name: Upload log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-core-log
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7

  unit-data:
    name: unit-data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests (data)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx vitest run tests/data \
            --pool=forks --poolOptions.forks.maxForks=1 2>&1 | tee ci-logs/unit-data.log
      - name: Upload log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-data-log
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7

  unit-ui:
    name: unit-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Unit tests (ui)
        run: |
          set -o pipefail
          mkdir -p ci-logs
          npx vitest run tests/ui \
            --pool=forks --poolOptions.forks.maxForks=1 2>&1 | tee ci-logs/unit-ui.log
      - name: Upload log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-ui-log
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3) 生产构建（产物 pwa-dist 供人工下载/发版；E2E 由本地 QA 跑）
  # ---------------------------------------------------------------------------
  build:
    name: build (pwa-dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: |
          set -o pipefail
          mkdir -p ci-logs
          pnpm build 2>&1 | tee ci-logs/build.log
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist
          retention-days: 7
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7

