name: e2e (public smoke)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  TZ: Asia/Shanghai

jobs:
  smoke:
    name: public smoke (reuse pwa-dist)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
      - uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install e2e deps
        run: npm install --prefix tools/e2e --no-audit --no-fund
      - name: Resolve browser
        shell: bash
        run: |
          set -uo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            npx -y playwright@1.49.0 install --with-deps chromium || true
            CHROME=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f 2>/dev/null | head -n1 || true)
          fi
          test -n "$CHROME" && { echo "E2E_CHROMIUM=$CHROME" >> "$GITHUB_ENV"; echo "CHROME=$CHROME" >> "$GITHUB_ENV"; }
      - name: Serve dist
        run: |
          mkdir -p ci-logs
          python3 -m http.server 4173 --directory dist > ci-logs/preview.log 2>&1 &
          echo $! > preview.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Run public smoke
        shell: bash
        run: node tests/e2e/prod-smoke-gates.mjs 2>&1 | tee ci-logs/smoke.log
      - name: Stop preview
        if: always()
        run: kill "$(cat preview.pid 2>/dev/null)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7
